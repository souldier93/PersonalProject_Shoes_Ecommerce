-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.2852" x="414.9294" y="657.7451">6. Stripe x&#7917; l&#253; thanh to&#225;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.1377" x="414.9294" y="674.0967">7. Stripe g&#7917;i webhook POST /payments/stripe/webhook</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.7974" x="414.9294" y="690.4482">8. System verify v&#7899;i stripe.webhooks.constructEvent()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.3159" x="414.9294" y="706.7998">9. System c&#7853;p nh&#7853;t bill status = PAID, gi&#7843;m stock, g&#7917;i email</text><!--SRC=[VLIxRXD15EtdAwvS4U67mXjB82MsWr94M7dKQ3o-zeuoEsDcPkrOY09H8Weg2XgYY0gbeygAolp8_WbtPYV6uTMjx-FSSywzOrvueujyX9QvKwbdtF8SNCR7PY7r52PSETpCuCi2jS03T8vFSKV9gGQ1sbE_bruXdFHQszlGWYDlvGnXo9SvfM5eZQ0UmcIC2syiD9uLw7m3k8ET460ZK-Wnjqjez38KfwRmq5dtd-p7ohq14qPxQnGqKgfN_rPeQwpX_XybHsZdKc3CfsysvfwFk4De71WzDVtTBeoaKgv9wWswFdekLHE4AMP6kzZQtsNaWfT2pZXHQYI9pxZ71L_Mw37q8eKOYygWzPI8Tob9tRL1R6yGeaIs2yFdHyVGcTLKNST5Y8wmI20jITRIhDl_gZ9w8ctE22ZW9N5T69oXA3p-PmkfD7G5xOV8nvs5bTJp7njOVnTQctFw9kTIGp1p4_6c3LteHJ7NR3iM9xHgI6BOpUgR0v80YwvG_jU8Q-yEwtYKdrocKA2AqU9G5rRGNLkGcTLd3Rww-kBf4fM77KN7gxcNSwHxmpE1Co-DXeao2mQW3LbYvcW9lBccTPnndO4tgtCDewfyHu3bLn1PLNwGmO1CLkLR6fE5dAhAZp9yNvKCzPYnNvYHN9CEQsW9TPUSXnyVLXU1txbXG-FytvaV1DS3moxRRiFHqddCwwRVLhvVty-yAZz9u3azCK_RBAobLxniGaxxZSkxqxvkzBQwkWWDR-0L22NZ-w5hzF2QtMt3dZK1SdnJOkeTA8pd2HDZSxWL9ODVNTA5LEKNFTrYzzfmuaYufjJbZBfNt-XlnajT-mFprMSuMvsBka2p-niJfrNvNa9z-UrqIprknqdghKsoM-p1Mj5PLLw2Mdsd4UkjiOVhDC5UIbZWA3Fcz1_lB6NPexNPj3qvMIPZ4wTKvG8v2XN23-Q1s1PxlEuJKNTKv-DJesRk2mTFOBYpts_2L9B_z4_hZJXj9d98hqo5sudd-1C0]--></g></svg>